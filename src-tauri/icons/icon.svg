<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f88ff"/>
      <stop offset="1" stop-color="#2747b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0b1640" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded tile with a soft light from the top left -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>

  <!-- Play / launch mark with rounded corners, optically centered -->
  <path filter="url(#shadow)" fill="#ffffff"
        d="M392 336
           C 392 298, 432 276, 465 295
           L 722 446
           C 755 465, 755 512, 722 531
           L 465 682
           C 432 701, 392 679, 392 641 Z"/>
</svg>
