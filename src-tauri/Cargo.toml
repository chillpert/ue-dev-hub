[package]
name = "ue-dev-hub"
version = "0.1.0"
description = "Desktop hub for Unreal Engine projects that use Git"
authors = ["chillpert"]
license = "MIT"
repository = "https://github.com/chillpert/ue-dev-hub"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ue_dev_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
toml = "1.2.1"
sha1_smol = "1.0.1"
serde_ignored = "0.1.14"
chrono = "0.4.45"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-notification = "2.8.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "rustls"] }
keyring = { version = "3", features = ["windows-native"] }
minisign-verify = "0.3.0"
base64 = "0.23.1"
sha2 = "0.11.1"
ue-dev-hub-addon = { path = "../addon-sdk" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

# Logins are kept in the desktop's keyring (Secret Service) on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Checks the tray library is there before Tauri loads it; without it, Tauri panics in setup.
libloading = "0.7"
