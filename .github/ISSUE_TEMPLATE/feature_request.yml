name: Feature request
description: An idea for something the hub could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or problem, and how you handle it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine the hub could do it. Rough is fine.
  - type: dropdown
    id: os
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows
        - Linux
